# Profile for mediaserver-image-base.
# Copy to config/test.yaml for a local run and set key_path to a private key
# already authorized for root on the development Raspberry Pi 4.
# Tvheadend and Nextcloud are intentionally absent from this profile.

profile: mediaserver-image-base

device:
  name: mediaserver
  host: 192.168.1.211
  ssh:
    port: 22
    username: root
    known_hosts: ~/.ssh/known_hosts
    connect_timeout: 10
    command_timeout: 30
    # Development image only: the root account has an empty password.
    # Prefer key_path for non-development devices.
    allow_empty_password: true

connectivity:
  tcp_ports:
    - {name: SSH, port: 22}
    - {name: Apache, port: 80}
    - {name: FileBrowser, port: 8090}
    - {name: MPD, port: 6600}
    - {name: PulseAudio TCP, port: 4713}
    - {name: MiniDLNA, port: 8200}
    - {name: Jellyfin, port: 8096}
    - {name: Transmission RPC, port: 9091}
    - {name: Samba, port: 445}
    - {name: FTP, port: 21}

system:
  required_commands: [uname, cat, df]
  filesystems:
    - {path: /, min_free_mb: 256}
  min_available_memory_mb: 64
  max_memory_used_percent: 90

# A service with required: false is reported as skipped when the selected
# hardware/configuration does not provide it (for example audio hardware).
services:
  - {name: apache2.service, manager: systemd, required: true, diagnostics: true}
  - {name: filebrowser.service, manager: systemd, required: true, diagnostics: true, ports: [{name: FileBrowser, port: 8090}]}
  - {name: mpd.service, manager: systemd, required: true, diagnostics: true, ports: [{name: MPD, port: 6600}]}
  - {name: ympd.service, manager: systemd, required: true, diagnostics: true}
  - {name: minidlna.service, manager: systemd, required: true, diagnostics: true, ports: [{name: MiniDLNA, port: 8200}]}
  - {name: transmission-daemon.service, manager: systemd, required: true, diagnostics: true, ports: [{name: Transmission RPC, port: 9091}]}
  - {name: vsftpd.service, manager: systemd, required: true, diagnostics: true, ports: [{name: FTP, port: 21}]}
  - {name: snapserver.service, manager: systemd, required: true, diagnostics: true}
  - {name: snapclient.service, manager: systemd, required: true, diagnostics: true}
  - {name: pulseaudio.service, manager: systemd, required: true, diagnostics: true}
  - {name: youtubedl-web.service, manager: systemd, required: true, diagnostics: true}
  - {name: alarm.service, manager: systemd, required: false, diagnostics: true}

mpd:
  # All tracks from the MPD database are added; the first one is played.
  startup_timeout: 8
  poll_interval: 0.5

snapcast:
  http_port: 1780
  expected_stream: MPD
  expected_source_path: /tmp/snapmpdfifo
  bluetooth_stream: Bluetooth

pulseaudio:
  tcp_port: 4713
  expected_protocol_version: "35"
  expected_user_name: pulse
  expected_server_name: pulseaudio
  expected_sample_specification: s16le 2ch 44100Hz
  expected_default_sink: alsa_output.headphones.stereo-fallback
  expected_default_source: alsa_output.headphones.stereo-fallback.monitor

http:
  timeout: 10
  verify_tls: true
  endpoints:
    - name: Apache root
      protocol: http
      port: 80
      path: /
      expected_status: [200, 403]
      follow_redirects: true
    - name: FileBrowser
      protocol: http
      port: 8090
      path: /
      expected_status: [200, 302, 401]
      follow_redirects: false
    - name: MiniDLNA status
      protocol: http
      port: 8200
      path: /
      expected_status: [200]
      content_type: text/html
    - name: Jellyfin web
      protocol: http
      port: 8096
      path: /
      expected_status: [200, 302]
      follow_redirects: true
    - name: Transmission RPC unauthenticated probe
      protocol: http
      port: 9091
      path: /transmission/rpc
      expected_status: [401, 403, 409]
      follow_redirects: false
    - name: Transmission web UI
      protocol: http
      port: 9091
      path: /transmission/web/
      expected_status: [200]
      follow_redirects: true
      auth:
        basic_username_env: TRANSMISSION_RPC_USERNAME
        basic_password_env: TRANSMISSION_RPC_PASSWORD
    - name: Snapcast web
      protocol: http
      port: 1780
      path: /
      expected_status: [200]
      required: true
  # Add response header expectations under an endpoint's `headers` map.

web_ui:
  enabled: true
  headless: true
  fail_on_console_errors: true
  endpoints:
    - name: MediaServer
      protocol: http
      port: 80
      path: /
      selectors:
        - body
      interactions: []
      screenshot_on_success: true
    - name: YMPD
      protocol: http
      port: 8080
      path: /
      selectors:
        - body
        - .starter-template
      interactions: []
      screenshot_on_success: true
      ignore_console_errors:
        - "Cannot read properties of undefined (reading 'pos')"
    - name: FileBrowser
      protocol: http
      port: 8090
      path: /
      selectors:
        - body
        - '#app'
      interactions: []
      screenshot_on_success: true
    - name: Jellyfin
      protocol: http
      port: 8096
      path: /
      selectors:
        - body
        - '#reactRoot'
      interactions: []
      screenshot_on_success: true
    - name: YouTubeDL
      protocol: http
      port: 80
      path: /youtubedl/
      selectors:
        - body
        - .container-fluid
      interactions: []
      screenshot_on_success: true
    - name: Snapcast
      protocol: http
      port: 1780
      path: /
      selectors:
        - body
      interactions: []
      screenshot_on_success: true
