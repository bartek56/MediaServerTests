# Copy this file to config/test.yaml and adjust it for the test device.
# Do not put passwords, tokens or private keys in this file.

device:
  name: mediaserver
  host: 192.168.1.211
  ssh:
    port: 22
    username: root
    known_hosts: ~/.ssh/known_hosts
    connect_timeout: 10
    command_timeout: 30
    allow_empty_password: true

connectivity:
  tcp_ports:
    - name: SSH
      port: 22
    - name: HTTP
      port: 80
    - {name: FileBrowser, port: 8090}
    - {name: MPD, port: 6600}
    - {name: MiniDLNA, port: 8200}
    - {name: Jellyfin, port: 8096}
    - {name: Transmission RPC, port: 9091}
    - {name: Samba, port: 445}
    - {name: FTP, port: 21}

system:
  # Missing diagnostic tools are reported as skipped checks, not as a broken
  # device. Only list tools expected in the selected Yocto image.
  required_commands: [uname, cat, df]
  filesystems:
    - path: /
      min_free_mb: 256
  min_available_memory_mb: 64
  max_memory_used_percent: 90
  # Set this only when a stable minimum uptime is part of the test case.
  # min_uptime_seconds: 60
  # Optional, bounded to the last 200 lines by the test.
  # log_source: /var/log/messages
  # critical_log_patterns: ["Kernel panic", "Out of memory"]

# Names and managers are configuration data. The test supports systemd,
# sysv and process checks; it does not assume every image uses systemd.
services:
  - {name: apache2.service, manager: systemd, required: true, diagnostics: true}
  - {name: filebrowser.service, manager: systemd, required: true, diagnostics: true, ports: [{name: FileBrowser, port: 8090}]}
  - {name: mpd.service, manager: systemd, required: true, diagnostics: true, ports: [{name: MPD, port: 6600}]}
  - {name: ympd.service, manager: systemd, required: true, diagnostics: true}
  - {name: minidlna.service, manager: systemd, required: true, diagnostics: true, ports: [{name: MiniDLNA, port: 8200}]}
  - {name: transmission-daemon.service, manager: systemd, required: true, diagnostics: true, ports: [{name: Transmission RPC, port: 9091}]}
  - {name: vsftpd.service, manager: systemd, required: true, diagnostics: true, ports: [{name: FTP, port: 21}]}
  - {name: snapserver.service, manager: systemd, required: false, diagnostics: true}
  - {name: snapclient.service, manager: systemd, required: false, diagnostics: true}
  - {name: pulseaudio.service, manager: systemd, required: false, diagnostics: true}
  - {name: youtubedl-web.service, manager: systemd, required: false, diagnostics: true}
  - {name: alarm.service, manager: systemd, required: false, diagnostics: true}

mpd:
  # All tracks from the MPD database are added; the first one is played.
  startup_timeout: 8
  poll_interval: 0.5

http:
  timeout: 10
  verify_tls: true
  # Use headers_from_env for values that must be sent with every request.
  # headers_from_env:
  #   X-Test-Run: RPI4_TEST_RUN_ID
  endpoints:
    - name: MediaServer web page
      url: http://192.168.1.211/
      expected_status: [200]
      follow_redirects: true
      content_type: text/html
    - name: FileBrowser
      url: http://192.168.1.211:8090/
      expected_status: [200, 302, 401]
      follow_redirects: false
    - name: MiniDLNA status
      url: http://192.168.1.211:8200/
      expected_status: [200]
      content_type: text/html
    - name: Jellyfin web
      url: http://192.168.1.211:8096/
      expected_status: [200, 302]
      follow_redirects: true
    - name: Transmission RPC unauthenticated probe
      url: http://192.168.1.211:9091/transmission/rpc
      expected_status: [401, 403, 409]
      follow_redirects: false
    - name: Snapcast web
      url: http://192.168.1.211:1780/
      expected_status: [200]
      required: false
  # Endpoint authentication is environment-only, for example:
  # - name: Protected API
  #   url: https://192.0.2.10/api/private
  #   auth: {bearer_token_env: RPI4_API_TOKEN}

web_ui:
  enabled: false
  headless: true
  fail_on_console_errors: true
  screenshot_dir: reports/screenshots
  endpoints:
    - name: MediaServer home
      url: http://192.168.1.211/
      selectors: ["body"]
      interactions: []
      screenshot_on_failure: true
