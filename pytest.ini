[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --maxfail=0
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_mode = w
markers =
    acceptance: checks requiring a configured Raspberry Pi 4
    unit: host-only framework tests with no Raspberry Pi or network
    connectivity: SSH and TCP connectivity checks
    system: remote operating-system checks
    services: service-manager and service-port checks
    http: HTTP/HTTPS endpoint checks
    web_ui: optional Playwright browser checks
